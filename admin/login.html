<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artabria · Acceso entrenador</title>
<link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
<div class="center-screen">
  <div class="card" style="max-width:380px;width:100%">
    <img src="/assets/img/logo.png" alt="Artabria" class="brand-logo-lg mb-16">
    <h2 id="titulo-modo">Acceso entrenador</h2>
    <div id="alert"></div>
    <form id="form-login">
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input type="password" id="password" required autocomplete="current-password" minlength="6">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="btn-submit">Entrar</button>
    </form>
    <button type="button" class="btn btn-ghost btn-block mt-16" id="btn-modo">¿Primera vez? Crear cuenta</button>
  </div>
</div>
<script type="module" src="/assets/js/admin-login.js"></script>
</body>
</html>
